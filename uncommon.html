<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">
  <style>
    .moves-header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;   /* 📱 狭い画面ではボタンが見出しの下に回ります */
  gap: 10px;
  margin-bottom: 15px;
}
.moves-header-row h2 { margin-bottom: 0; }
.awaken-btn-group { margin: 0; }

    /* ⚡ 未覚醒 / 覚醒ボタン */
.awaken-btn-group { display: flex; gap: 10px; margin: 0 0 14px; }
.awaken-btn {
  padding: 6px 18px; font-weight: bold; font-size: 1rem; border-radius: 6px;
  cursor: pointer; background: #2b2b2b; color: #ccc; border: 2px solid #444; transition: all 0.2s;
}
#unawakened-btn.active { background: linear-gradient(to bottom, #d4d4d4, #888); color: #000; border-color: #fff; }
#awakened-btn.active { background: linear-gradient(to bottom, #fff464, #f6ab12); color: #000; border-color: #ffe600; box-shadow: 0 0 8px rgba(255,230,0,0.4); }

/* ✨ 覚醒演出 */
.awaken-overlay {
  position: fixed; inset: 0; z-index: 9999; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0); transition: background 0.8s ease;
  --awaken-color: #ff9d2e;
}
.awaken-overlay.show { background: rgba(0,0,0,0.88); }
.awaken-fruit {
  position: relative; z-index: 2; width: min(60vw, 260px); height: auto;
  opacity: 0; transform: translateY(80px) scale(0.5);
  transition: opacity 1s ease, transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.awaken-overlay.show .awaken-fruit { opacity: 1; transform: translateY(0) scale(1); }
.awaken-aura {
  position: absolute; z-index: 1; width: min(90vw, 520px); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle,
    color-mix(in srgb, var(--awaken-color) 60%, white) 0%,
    color-mix(in srgb, var(--awaken-color) 55%, transparent) 35%,
    transparent 70%);
  opacity: 0; transform: scale(0.3);
}
.awaken-overlay.power .awaken-aura { animation: awakenAura 2.5s ease-in forwards; }
.awaken-overlay.power .awaken-fruit { animation: awakenFloat 2.4s ease-in-out infinite, awakenGlow 2.5s ease-in forwards; }
@keyframes awakenAura { 0% { opacity: 0; transform: scale(0.3); } 30% { opacity: 0.9; } 100% { opacity: 1; transform: scale(1.6); } }
@keyframes awakenFloat { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-12px) scale(1.04); } }
@keyframes awakenGlow {
  from { filter: drop-shadow(0 0 4px var(--awaken-color)) brightness(1); }
  to   { filter: drop-shadow(0 0 40px var(--awaken-color)) brightness(1.6); }
}
.awaken-flash { position: absolute; inset: 0; z-index: 3; background: #fff; opacity: 0; pointer-events: none; }
.awaken-overlay.flash .awaken-flash { opacity: 1; transition: opacity 0.6s ease-in; }
.awaken-overlay.done { background: transparent; transition: none; }
.awaken-overlay.done .awaken-fruit, .awaken-overlay.done .awaken-aura { display: none; }
.awaken-overlay.done .awaken-flash { opacity: 0; transition: opacity 0.9s ease-out; }

    .move-mastery {

    .move-view-btn {
      display: inline-block;
      text-decoration: none;
      background: linear-gradient(to bottom, #fff464 0%, #fcd32d 45%, #f6ab12 50%, #e28e04 100%);

      font-size: 15px;
      letter-spacing: 0.5px;
      padding: 6px 18px;

        -2px -2px 0 #000,  
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
         2px  3px 0px #000;

    .move-view-btn:hover {

    .move-view-btn:active {

      transform: translateY(4px);

    .move-view-btn.active {

      border-color: #520b0b !important;
      border-bottom-color: #380505 !important;
      animation: pressClick 0.15s ease-out;

    @keyframes pressClick {
      0% { transform: translateY(0); border-bottom-width: 5.5px; }
      50% { transform: translateY(4px); border-bottom-width: 1.5px; }

    .detail-box {

    }

      color: #fff;

    }

    }

    .skin-btn {

      color: #ffffff;
      border: 1px solid #555555;

      font-weight: bold;

      justify-content: center;

      color: #000000;
    }

  text-shadow: 1px 1px 2px #000;
}
.awakening-val img {
  width: 18px;
  height: 18px;
  object-fit: contain;
  vertical-align: -3px;
  margin-right: 6px;
}
.awakening-table tr.total .awakening-key {
  background: #6b4f12;
  color: #ffcc00;
  font-size: 0.95rem;
}
.awakening-table tr.total .awakening-val {
  background: #2a2412;
  color: #ffcc00;
}

    @media (max-width: 600px) {
      .showcase-container {
        flex-direction: column;
      }
      .showcase-img {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>

// ⚡ 覚醒の状態(ページを開き直すとリセット = 演出は1回きり)
let awakenMode = 'normal';
let awakenPlayed = false;
let awakenBusy = false;

function setAwakenMode(mode) {
  awakenMode = mode;
  document.getElementById('unawakened-btn')?.classList.toggle('active', mode === 'normal');
  document.getElementById('awakened-btn')?.classList.toggle('active', mode === 'awakened');
  const lang = localStorage.getItem('selectedLang') || 'en';
  renderMovesets(getItemFromUrl().name, lang);
}

function switchAwaken(mode) {
  if (awakenBusy || mode === awakenMode) return;
  if (mode === 'awakened' && !awakenPlayed) {
    awakenPlayed = true;                       // 2回目以降は演出なしで即切り替え
    playAwakenAnimation(() => setAwakenMode('awakened'));
  } else {
    setAwakenMode(mode);                       // 未覚醒に戻すときも演出なし
  }
}

function playAwakenAnimation(onSwitch) {
  awakenBusy = true;
  const src = document.getElementById('detail-img').src;
  const ov = document.createElement('div');
  ov.className = 'awaken-overlay';
  ov.innerHTML = `<div class="awaken-aura"></div><img class="awaken-fruit" src="${src}" alt=""><div class="awaken-flash"></div>`;
  const info = (typeof itemOverviewData !== 'undefined') ? itemOverviewData[getItemFromUrl().name] : null;
  const color = info && info.meta && info.meta.awakenColor;
  if (color) ov.style.setProperty('--awaken-color', color);
  document.body.appendChild(ov);

  requestAnimationFrame(() => ov.classList.add('show'));   // 暗転 + 画像が浮き出る
  setTimeout(() => ov.classList.add('power'), 1200);       // 覚醒オーラ(2.5秒)
  setTimeout(() => ov.classList.add('flash'), 3700);       // 画面が白くなる
  setTimeout(() => { onSwitch(); ov.classList.add('done'); }, 4300); // 真っ白な間に技を切り替え
  setTimeout(() => { ov.remove(); awakenBusy = false; }, 5300);
}

// 「戻る」で復元されたときは、未覚醒に戻して演出も再び見られるようにする
window.addEventListener('pageshow', (e) => {
  if (e.persisted) {
    awakenPlayed = false;
    awakenBusy = false;
    document.querySelector('.awaken-overlay')?.remove();
    setAwakenMode('normal');
  }
});

function getItemFromUrl() {
  const params = new URLSearchParams(window.location.search);

}

// 🎬 動画・画像（.png/.gif等）自動判定 & 再生ボタンなしループ再生対応版 renderProConSection（全カテゴリ対応）
function renderProConSection(itemName, lang, mode) {
  const container = document.getElementById('procon-box');
  if (!container) return;

  const db = (typeof proConDatabase !== 'undefined') ? proConDatabase : {};
  const data = db[itemName];

  if (!data || !data[mode]) {
    container.innerHTML = `<p style="color: #888; padding: 10px;">${lang === 'ja' ? 'データがありません' : 'No data available'}</p>`;
    return;
  }

  const currentData = data[mode];
  const categories = [
    { key: 'general', title: { en: 'General', ja: '全般' } },
    { key: 'm1', title: { en: 'M1', ja: 'M1' } },
    { key: 'z', title: { en: 'Z Move', ja: 'Z 技' } },
    { key: 'x', title: { en: 'X Move', ja: 'X 技' } },
    { key: 'c', title: { en: 'C Move', ja: 'C 技' } },
    { key: 'v', title: { en: 'V Move', ja: 'V 技' } },
    { key: 'f', title: { en: 'F Move', ja: 'F 技' } }
  ];

  let html = '';

  categories.forEach(cat => {
    const catData = currentData[cat.key];
    if (!catData) return;

    const titleText = cat.title[lang] || cat.title['en'];
    
    let items = [];
    if (Array.isArray(catData[lang])) {
      items = catData[lang];
    } else if (Array.isArray(catData.ja) && lang === 'ja') {
      items = catData.ja;
    } else if (Array.isArray(catData.en)) {
      items = catData.en;
    }
    
    const mediaList = catData.media || catData.videos || [];

    if (items.length === 0 && mediaList.length === 0) return;

    html += `<div class="procon-category" style="margin-bottom: 20px;">`;
    html += `<div class="procon-category-title">${titleText}</div>`;

    if (items.length > 0) {
      html += `<ul class="procon-list">`;
      items.forEach(item => {
        html += `<li>${item}</li>`;
      });
      html += `</ul>`;
    }

    if (mediaList.length > 0) {
      html += `<div class="procon-videos" style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; width: 100%;">`;
      mediaList.forEach(src => {
        const isImage = /\.(png|jpe?g|gif|webp)$/i.test(src);

        if (isImage) {
          html += `
            <img src="${src}" alt="Media" 
                 style="flex: 1 1 280px; max-width: 320px; width: 100%; height: auto; aspect-ratio: 16/9; border-radius: 6px; border: 1px solid #444; background: #000; object-fit: cover;"
                 onerror="this.style.display='none';">
          `;
        } else {
          html += `
            <video src="${src}" autoplay loop muted playsinline 
                   style="flex: 1 1 280px; max-width: 320px; width: 100%; height: auto; aspect-ratio: 16/9; border-radius: 6px; border: 1px solid #444; background: #000; object-fit: cover;"
                   onerror="this.style.display='none';">
            </video>
          `;
        }
      });
      html += `</div>`;
    }

    html += `</div>`;
  });

  container.innerHTML = html || `<p style="color: #888; padding: 10px;">${lang === 'ja' ? 'データがありません' : 'No data available'}</p>`;
}

// 🎬 コンボ専用：ローカル動画とYouTube（通常の操作できるプレイヤー＆ループ対応）を自動判別して綺麗に収める関数
function renderComboMedia(src) {
  if (!src) return '';

  // YouTubeのURLやIDかどうかの判定
  const isYouTube = src.includes('youtube.com') || src.includes('youtu.be') || src.length === 11;

  if (isYouTube) {
    let videoId = src;
    if (src.includes('youtube.com') || src.includes('youtu.be')) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = src.match(regExp);
      if (match && match[2].length === 11) {
        videoId = match[2];
      }
    }
    // コンボ用のYouTubeプレイヤー（loop=1 と playlist=videoId でループ再生に対応）
    return `
      <div style="position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 6px; overflow: hidden; border: 1px solid #333; background: #000;">
        <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}&playsinline=1" 
                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
    `;
  } else {
    // 今まで通りのローカル動画
    return `
      <div style="border-radius: 6px; overflow: hidden; border: 1px solid #333;">
        <video src="${src}" controls autoplay loop muted playsinline style="width: 100%; display: block; background: #000; object-fit: cover;" onerror="this.parentElement.style.display='none';"></video>
      </div>
    `;
  }
}

    return;
  }

  let html = '';
  combos.forEach(c => {
    const title = (c.name && c.name[lang]) ? c.name[lang] : (c.name ? c.name['en'] : '');
    const desc = (c.desc && c.desc[lang]) ? c.desc[lang] : (c.desc ? c.desc['en'] : '');
    
    const seqText = (typeof c.sequence === 'object')
      ? (c.sequence[lang] || c.sequence['en'])
      : c.sequence;

    const videoHTML = c.video ? `
      <div style="margin-top: 12px;">

  });

function toggleMoveDetails(btn) {
  const wrapper = btn.closest('.move-wrapper');
  const detailsContent = wrapper.querySelector('.move-details-content');
  const isOpen = detailsContent.classList.contains('open');
  const currentLang = localStorage.getItem('selectedLang') || 'en';

  if (isOpen) {
    detailsContent.classList.remove('open');
    btn.classList.remove('active');
    btn.setAttribute('data-en', 'View');
    btn.setAttribute('data-ja', '詳細');
    btn.textContent = currentLang === 'ja' ? '詳細' : 'View';

    const videos = wrapper.querySelectorAll('video.showcase-video');
    videos.forEach(video => video.pause());
  } else {
    detailsContent.classList.add('open');
    btn.classList.add('active');
    btn.setAttribute('data-en', 'Close');
    btn.setAttribute('data-ja', '閉じる');
    btn.textContent = currentLang === 'ja' ? '閉じる' : 'Close';

    const videos = wrapper.querySelectorAll('video.showcase-video');
    videos.forEach(video => {
      const dataSrc = video.getAttribute('data-src');
      if (dataSrc && !video.src) {
        video.src = dataSrc;
      }
      if (video.src) {
        video.play().catch(() => {});
      }
    });
  }
}

                 style="width: 100%; max-width: 320px; height: auto; aspect-ratio: 16/9; background: #000; border-radius: 6px; object-fit: cover;"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"></video>
        `;

        showcasesHTML += `
          <div class="showcase-item" style="${index > 0 ? 'margin-top: 14px; padding-top: 14px; border-top: 1px dashed #333;' : ''}">
            ${labelText ? `<div style="font-size: 0.9rem; font-weight: bold; color: #ffcc00; margin-bottom: 6px;">[ ${labelText} ]</div>` : ''}
            <div style="display: flex; gap: 15px; align-items: flex-start; flex-wrap: wrap; width: 100%;">
              ${mediaHTML}
              <div class="video-error-fallback" style="display: none; width: 100%; max-width: 320px; aspect-ratio: 16/9; background: #1a1a1a; border: 1px dashed #555; border-radius: 6px; align-items: center; justify-content: center; color: #888; font-size: 13px;">
                ${lang === 'ja' ? '動画が見つかりません' : 'Video not found'}
              </div>
              <p class="showcase-text" style="flex: 1; min-width: 200px; margin: 0; align-self: center;">${descText}</p>
            </div>
          </div>
        `;
      });

      moveWrapper.innerHTML = `
        <div class="move-card">
          <div class="move-left">
            <div class="move-key">${keyUpper}</div>
            <div class="move-info">
              <div class="move-title" style="display: flex; align-items: center;">
                ${title} ${holdBadgeHTML}
              </div>
              <div class="move-mastery">${masteryText}</div>
            </div>
          </div>
          <button class="move-view-btn" data-en="View" data-ja="詳細" onclick="toggleMoveDetails(this)">${viewBtnText}</button>
        </div>

        <div class="move-details-content">
          <div class="detail-box">
            <h3>${labels.detailsTitle}</h3>
            <div class="details-info-list">
              <div>${labels.cooldown}: ${cooldownVal}</div>
              <div><span class="highlight-yellow">${labels.energy}:</span> ${move.energy || '-'}</div>
              ${move.instinctBreak !== undefined ? `
                <div><span class="highlight-yellow">${labels.breaksInstinct}:</span> 
                  <span class="${move.instinctBreak ? 'highlight-green' : 'highlight-red'}">${move.instinctBreak ? '✔' : '✖'}</span>
                </div>` : ''}
              ${instinctText ? `
                <ul class="details-bullet-list">
                  <li><span class="highlight-yellow">${labels.instinctLabel}:</span>${instinctText}</li>
                </ul>` : ''}
            </div>
          </div>

          <div class="detail-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
              <h3 style="margin: 0;">${labels.showcaseTitle}</h3>
              ${skinAllBtnHTML}
            </div>
            <div class="showcase-container" style="display: flex; flex-direction: column;">
              ${showcasesHTML}
            </div>
          </div>
        </div>
      `;
    } else {
      const noneTitle = lang === 'ja' ? 'なし' : 'None';
      
      moveWrapper.innerHTML = `
        <div class="move-card" style="opacity: 0.6;">
          <div class="move-left">
            <div class="move-key" style="color: #888;">${keyUpper}</div>
            <div class="move-info">
              <div class="move-title" style="color: #aaa;">${noneTitle}</div>
              <div class="move-mastery" style="color: #666;">-</div>
            </div>
          </div>
        </div>
      `;
    }

    container.appendChild(moveWrapper);
  });
}

function updateItemDetails(lang) {
  try {
    const itemInfo = typeof getItemFromUrl === 'function' ? getItemFromUrl() : { name: '', type: '' };
    const itemName = itemInfo.name || '';
    const itemType = itemInfo.type || '';

    const nameEl = document.getElementById('detail-name');
    if (nameEl) {
      if (typeof itemTranslations !== 'undefined' && itemTranslations[itemName] && itemTranslations[itemName][lang]) {
        nameEl.textContent = itemTranslations[itemName][lang];
      } else if (itemName) {
        nameEl.textContent = itemName.replace(/_/g, ' ');
      } else {
        nameEl.textContent = 'Unknown';
      }
    }

    const ingameSec = document.getElementById('ingame-desc-section');
    const ingameText = document.getElementById('ingame-desc');
    const overviewDb = (typeof itemOverviewData !== 'undefined') ? itemOverviewData : {};
    const data = overviewDb[itemName];
        const awakenGroup = document.getElementById('awaken-btn-group');
    const canAwaken = !!(data && data.meta && data.meta.hasAwakening);
    if (awakenGroup) awakenGroup.style.display = canAwaken ? 'flex' : 'none';
    if (!canAwaken) awakenMode = 'normal';

    if (data && data.ingameDesc && ingameSec) {
      ingameSec.style.display = 'block';
      if (ingameText) {
        ingameText.textContent = (data.ingameDesc[lang]) ? data.ingameDesc[lang] : (data.ingameDesc.en || '');
      }
    } else if (ingameSec) {
      ingameSec.style.display = 'none';
    }

    const metaTypeEl = document.getElementById('meta-type');
    const metaRarityEl = document.getElementById('meta-rarity');
    const metaM1El = document.getElementById('meta-m1');
    const priceMoneyEl = document.getElementById('price-money');
    const priceRobuxEl = document.getElementById('price-robux');
    const descEl = document.getElementById('detail-description');
    const historyEl = document.getElementById('detail-history');
    const notesEl = document.getElementById('detail-notes');

    if (data && data.meta) {
      if (metaTypeEl) metaTypeEl.textContent = (data.meta.type && data.meta.type[lang]) ? data.meta.type[lang] : (data.meta.type ? data.meta.type['en'] : '-');
      if (metaRarityEl) metaRarityEl.textContent = (data.meta.rarity && data.meta.rarity[lang]) ? data.meta.rarity[lang] : (data.meta.rarity ? data.meta.rarity['en'] : '-');
      if (metaM1El) metaM1El.textContent = (data.meta.m1 && data.meta.m1[lang]) ? data.meta.m1[lang] : (data.meta.m1 ? data.meta.m1['en'] : '-');
      if (priceMoneyEl) priceMoneyEl.textContent = data.meta.money || '-';
      if (priceRobuxEl) priceRobuxEl.textContent = data.meta.robux || '-';

      if (descEl) descEl.innerHTML = (data.description && data.description[lang]) ? data.description[lang] : (data.description ? data.description['en'] : '-');
      if (historyEl) historyEl.innerHTML = (data.history && data.history[lang]) ? data.history[lang] : (data.history ? data.history['en'] : '-');
      
      if (notesEl) {
        if (data.notes) {
          let notesText = '';
          let notesMedia = [];

          if (data.notes[lang] || data.notes.en) {
            if (typeof data.notes[lang] === 'string' || typeof data.notes.en === 'string') {
              notesText = data.notes[lang] || data.notes.en || '';
            } else if (typeof data.notes[lang] === 'object' || typeof data.notes.en === 'object') {
              const langObj = data.notes[lang] || data.notes.en || {};
              notesText = langObj.text || '';
              notesMedia = langObj.media || langObj.videos || [];
            }
          }

          if (data.notes.text) {
            notesText = data.notes.text[lang] || data.notes.text.en || '';
          }
          if (data.notes.media || data.notes.videos) {
            notesMedia = data.notes.media || data.notes.videos || [];
          }

          let notesHTML = notesText || '-';

          if (notesMedia.length > 0) {
            notesHTML += `<div class="notes-media" style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; width: 100%;">`;
            notesMedia.forEach(src => {
              const isImage = /\.(png|jpe?g|gif|webp)$/i.test(src);
              if (isImage) {
                notesHTML += `
                  <img src="${src}" alt="Note media" 
                       style="flex: 1 1 280px; max-width: 320px; width: 100%; height: auto; aspect-ratio: 16/9; border-radius: 6px; border: 1px solid #444; background: #000; object-fit: cover;"
                       onerror="this.style.display='none';">
                `;
              } else {
                notesHTML += `
                  <video src="${src}" autoplay loop muted playsinline 
                         style="flex: 1 1 280px; max-width: 320px; width: 100%; height: auto; aspect-ratio: 16/9; border-radius: 6px; border: 1px solid #444; background: #000; object-fit: cover;"
                         onerror="this.style.display='none';">
                  </video>
                `;
              }
            });
            notesHTML += `</div>`;
          }

          notesEl.innerHTML = notesHTML;
        } else {
          notesEl.innerHTML = '-';
        }
      }

      const immunitySec = document.getElementById('immunity-section');
      const immunityVideo = document.getElementById('immunity-video');
      const immunityDesc = document.getElementById('immunity-desc');

      if (data.meta.hasImmunity && data.immunity && immunitySec) {
        immunitySec.style.display = 'block';
        if (immunityVideo) immunityVideo.src = data.immunity.video || '';
        if (immunityDesc) {
          immunityDesc.textContent = (data.immunity.desc && data.immunity.desc[lang]) 
            ? data.immunity.desc[lang] 
            : (data.immunity.desc ? data.immunity.desc.en : '');
        }
      } else if (immunitySec) {
        immunitySec.style.display = 'none';
      }
    } else {
      if (metaTypeEl) metaTypeEl.textContent = itemType ? itemType.toUpperCase() : '-';
      if (metaRarityEl) metaRarityEl.textContent = '-';
      if (metaM1El) metaM1El.textContent = '-';
      if (priceMoneyEl) priceMoneyEl.textContent = '-';
      if (priceRobuxEl) priceRobuxEl.textContent = '-';

      if (descEl) descEl.innerHTML = lang === 'ja' ? '詳細情報は準備中です。' : 'Details coming soon.';
      if (historyEl) historyEl.innerHTML = '-';
      if (notesEl) notesEl.innerHTML = '-';

      const immunitySec = document.getElementById('immunity-section');
      if (immunitySec) immunitySec.style.display = 'none';
    }

    const imgEl = document.getElementById('detail-img');
    if (imgEl && itemName) {
      let folder = 'fruits';
      let suffix = '_Fruit.webp';

      if (itemType === 'style') { folder = 'styles'; suffix = '.webp'; }
      else if (itemType === 'sword') { folder = 'swords'; suffix = '.webp'; }
      else if (itemType === 'gun') { folder = 'guns'; suffix = '.webp'; }
      else if (itemType === 'gear') { folder = 'gears'; suffix = '.webp'; }
      else if (itemType === 'rod') { folder = 'rods'; suffix = '.webp'; }

      imgEl.src = `images/${folder}/${itemName}${suffix}`;
      imgEl.onerror = () => {
        if (imgEl.src.endsWith('.webp')) {
          imgEl.src = imgEl.src.replace('.webp', '.png');
        } else {
          imgEl.src = 'images/ItemPlaceHolder.webp';
        }
      };
    }
  } catch (err) {
    console.error("updateItemDetails error:", err);
  }
}
// 🔮 覚醒セクションの描画
function renderAwakening(itemName, lang) {
  const sec = document.getElementById('awakening-section');
  if (!sec) return;

  const db = (typeof itemOverviewData !== 'undefined') ? itemOverviewData : {};
  const data = db[itemName];
  const aw = data && data.awakening;

  if (!(data && data.meta && data.meta.hasAwakening && aw && aw.costs)) {
    sec.style.display = 'none';
    return;
  }
  sec.style.display = 'block';

  const descEl = document.getElementById('awakening-desc');
  if (descEl) descEl.innerHTML = aw.desc ? (aw.desc[lang] || aw.desc.en || '') : '';

  const icon = `<img src="images/currency/Fragment.webp" alt="Fragment">`;
  const costs = aw.costs;
  const total = Object.values(costs).reduce((sum, n) => sum + n, 0);

  let rows = '';
  Object.keys(costs).forEach(key => {
    rows += `
      <tr>
        <td class="awakening-key">${key.toUpperCase()}</td>
        <td class="awakening-val">${icon}${costs[key].toLocaleString()}</td>
      </tr>`;
  });
  rows += `
    <tr class="total">
      <td class="awakening-key">${lang === 'ja' ? '合計' : 'Total'}</td>
      <td class="awakening-val">${icon}${total.toLocaleString()}</td>
    </tr>`;

  const listEl = document.getElementById('awakening-costs');
  if (listEl) listEl.innerHTML = `<table class="awakening-table">${rows}</table>`;
}

function updateDetailPageLanguage(lang) {
  try {
    localStorage.setItem('selectedLang', lang);

    const translatableElements = document.querySelectorAll('.translatable');
    translatableElements.forEach(el => {
      const text = el.getAttribute(`data-${lang}`);
      if (text) {
        el.innerHTML = text;
      }
    });

    updateItemDetails(lang);

    const itemInfo = typeof getItemFromUrl === 'function' ? getItemFromUrl() : { name: '', type: '' };
    if (typeof renderMovesets === 'function') renderMovesets(itemInfo.name, lang);
    if (typeof renderAwakening === 'function') renderAwakening(itemInfo.name, lang);
    if (typeof renderProConSection === 'function') renderProConSection(itemInfo.name, lang, typeof currentProConMode !== 'undefined' ? currentProConMode : 'pros');
    if (typeof renderCombos === 'function') renderCombos(itemInfo.name, lang);
  } catch (err) {
    console.error("updateDetailPageLanguage error:", err);
  }
}

function initDetailPage() {
  try {
    const initialLang = localStorage.getItem('selectedLang') || 'en';

    window.applyLanguage = function(lang) {
      updateDetailPageLanguage(lang);
    };

    updateDetailPageLanguage(initialLang);

    const langBtn = document.getElementById('lang-toggle-btn');
    if (langBtn) {
      langBtn.onclick = (e) => {
        e.stopPropagation();
        const current = localStorage.getItem('selectedLang') || 'en';
        const nextLang = current === 'en' ? 'ja' : 'en';
        updateDetailPageLanguage(nextLang);
      };
    }
  } catch (err) {
    console.error("Detail page init error:", err);
  }
}

document.addEventListener('click', function(e) {
  const link = e.target.closest('.wiki-link');
  if (link) {
    e.preventDefault();
    const href = link.getAttribute('href');
    if (href) {
      history.pushState(null, '', href);
      const currentLang = localStorage.getItem('selectedLang') || 'en';
      updateDetailPageLanguage(currentLang);
      window.scrollTo(0, 0);
    }
  }
});

window.addEventListener('popstate', function() {
  const currentLang = localStorage.getItem('selectedLang') || 'en';
  updateDetailPageLanguage(currentLang);
});

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initDetailPage);
} else {
  initDetailPage();
}

window.addEventListener('pageshow', function(e) {
  if (e.persisted) {
    const currentLang = localStorage.getItem('selectedLang') || 'en';
    updateDetailPageLanguage(currentLang);
  }
});

let lastUrl = window.location.href;
let reloadTimer = null;

function checkUrlAndReload() {
  const currentUrl = window.location.href;

  if (currentUrl !== lastUrl) {
    lastUrl = currentUrl;

    if (reloadTimer) clearTimeout(reloadTimer);

    const reloadKey = 'reloaded_' + currentUrl;
    if (!sessionStorage.getItem(reloadKey)) {
      reloadTimer = setTimeout(() => {
        sessionStorage.setItem(reloadKey, 'true');
        window.location.reload();
      }, 300);
    }
  }
}

setInterval(checkUrlAndReload, 100);

document.addEventListener('click', function(e) {
  const link = e.target.closest('.wiki-link');
  if (link) {
    e.preventDefault();
    const href = link.getAttribute('href');
    if (href) {
      history.replaceState(null, '', href);
      checkUrlAndReload();
    }
  }
});

window.addEventListener('popstate', function() {
  checkUrlAndReload();
});

window.addEventListener('pageshow', function() {
  checkUrlAndReload();
});

window.addEventListener('pagehide', function() {
  Object.keys(sessionStorage).forEach(key => {
    if (key.startsWith('reloaded_')) {
      sessionStorage.removeItem(key);
    }
    });
});

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initDetailPage);
} else {
  initDetailPage();
}
</script>
